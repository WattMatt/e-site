name: Deploy DB Migrations

# Applies Supabase migrations to production via supabase db push, THEN reads
# every object the migrations declare back out of the database.
# Triggers:
#   • workflow_dispatch — manual run from the Actions UI or gh workflow run.
#   • push to main touching a migration file — auto-applies new migrations.
# Requires repo secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and
# SUPABASE_DB_PASSWORD (bound 2026-06-02). The path filter stops the auto-run
# from firing on pushes that don't change a migration.
#
# ⚠ A green `supabase db push` is NOT evidence a migration ran. db push keys on
# the version PREFIX, so a number already present in schema_migrations makes it
# print "Remote database is up to date", exit 0 and SKIP the file — which is
# exactly how PR #163's migration merged green and never applied. The
# "Verify migrations actually applied" step below is what turns that into a red
# build: it re-reads every object declared in each migration's `-- @verify:`
# block, and fails if a file's version is missing from the ledger.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/edge-functions/supabase/migrations/**'

# One deploy at a time. On 2026-10-05 three merges deployed together (runs
# 37287268899, 37289583207, 37290886514); their verify steps shared the
# Management API rate limit and run 37289583207 went red on 543 throttled
# calls with no false predicate. Serialising also stops two `supabase db push`
# runs racing on the same ledger. cancel-in-progress is false so a running
# push is never killed mid-apply; GitHub keeps at most one run PENDING and
# replaces it with a newer one, which is safe — a later commit's checkout
# carries every earlier migration.
concurrency:
  group: deploy-db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations
        working-directory: apps/edge-functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_REF
          supabase db push

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A green `supabase db push` is NOT evidence a migration ran: db push keys
      # on the version PREFIX, so a number already in schema_migrations makes it
      # print "Remote database is up to date", exit 0 and skip the file. This
      # step reads every declared object back out of the database.
      - name: Verify migrations actually applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node --experimental-strip-types scripts/verify-migration-applied.ts
